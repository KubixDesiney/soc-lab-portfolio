name: Collector self-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r collectors/requirements.txt
      - name: Run offline collector tests
        run: |
          python collectors/sias_collector.py --self-test
          python collectors/supabase_collector.py --self-test
          python collectors/vercel_collector.py --self-test
